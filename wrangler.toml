name = "ai-docent-doa"
main = "worker/index.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "doa.yestar.dev", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

[placement]
mode = "smart"

[[durable_objects.bindings]]
name = "CLASSIFY_PROXY"
class_name = "ClassifyProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassifyProxy"]
